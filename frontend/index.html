<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>CredVault</title>
<style>
*{box-sizing:border-box}body{margin:0;font-family:Inter,Arial,sans-serif;color:#e7ecf7;background:#070b14}.app{min-height:100vh;background:radial-gradient(circle at 15% 15%,rgba(48,105,224,.14),transparent 28%),radial-gradient(circle at 85% 65%,rgba(132,61,230,.13),transparent 30%),#070b14}.top{height:68px;display:flex;align-items:center;justify-content:space-between;padding:0 5%;border-bottom:1px solid #182235;background:rgba(5,8,15,.88);position:sticky;top:0;z-index:10}.brand{font-size:21px;font-weight:800;color:#fff;text-decoration:none}.brand span,h1 span{color:#7b62ff}.nav{display:flex;gap:22px;align-items:center}.nav a,.nav button{color:#9da8ba;background:none;border:0;text-decoration:none;font-size:13px;cursor:pointer}.nav a:hover,.nav a.active{color:#fff}.page{max-width:1180px;margin:auto;padding:42px 24px 80px;min-height:calc(100vh - 115px)}footer{text-align:center;color:#68748a;border-top:1px solid #151e2e;padding:22px;font-size:12px}.hero{min-height:610px;display:grid;place-items:center;text-align:center;position:relative;overflow:hidden}.hero h1{font-size:72px;letter-spacing:-4px;margin:0 0 18px}.hero p{color:#9ca6b8;font-size:17px;margin-bottom:34px}.eyebrow{font-size:11px;letter-spacing:2px;color:#71809a;font-weight:700;margin-bottom:14px}.glow{position:absolute;border-radius:50%;filter:blur(70px);opacity:.55}.g1{width:280px;height:280px;background:#1c5ee0;left:-140px;top:20px}.g2{width:330px;height:330px;background:#7626cb;right:-150px;bottom:0}.content{position:relative;z-index:1}.buttons{display:flex;gap:12px;justify-content:center;flex-wrap:wrap}.btn{display:inline-flex;align-items:center;justify-content:center;min-height:43px;padding:0 17px;border:1px solid #2b374e;border-radius:9px;background:#182131;color:#fff;font-weight:600;font-size:13px;cursor:pointer;text-decoration:none}.btn:hover{border-color:#52627f;transform:translateY(-1px)}.primary{background:linear-gradient(135deg,#347fff,#704dff);border-color:transparent;box-shadow:0 8px 25px rgba(63,100,255,.2)}.wide{width:100%}.header{margin-bottom:25px}.header h2{font-size:31px;letter-spacing:-1px;margin:0 0 8px}.header p{margin:0;color:#8994a9;font-size:14px}.card{background:rgba(13,18,30,.94);border:1px solid #202b40;border-radius:16px;box-shadow:0 20px 60px rgba(0,0,0,.22)}.form-card{max-width:820px;padding:30px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:20px}.field{display:flex;flex-direction:column;gap:8px;margin-bottom:18px}.field label{font-size:12px;font-weight:600;color:#cbd3e2}.field input,.field select{height:44px;padding:0 13px;border-radius:9px;border:1px solid #29354b;background:#0a101c;color:#edf2fa;outline:none}.field input:focus,.field select:focus{border-color:#527eff;box-shadow:0 0 0 3px rgba(82,126,255,.1)}.radio{display:flex;gap:16px;align-items:center;height:44px}.radio label{font-size:13px;color:#abb5c6}.radio input{accent-color:#5b7fff}.error{margin:15px 0;padding:11px 13px;border-radius:9px;border:1px solid #5a2931;background:#251318;color:#ffabb5;font-size:13px}.success{text-align:center;padding:28px}.check{width:52px;height:52px;border-radius:50%;display:grid;place-items:center;background:#123322;color:#65e4a0;font-size:27px;margin:0 auto 14px}.compact{padding:28px}.inline{display:flex;gap:15px;align-items:end;max-width:680px}.inline .field{flex:1;margin:0}.result{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-top:24px;padding:18px;border:1px solid #25324a;border-radius:12px;background:#0a101b}.result div{display:flex;flex-direction:column;gap:6px}.result span{font-size:10px;color:#748097;text-transform:uppercase;letter-spacing:.7px}.result strong{font-size:14px}.status{display:inline-flex;padding:5px 9px;border-radius:999px;font-size:11px;font-weight:700;width:max-content}.pending{background:#3a2f12;color:#ffd86a}.approved,.valid{background:#103323;color:#69e5a1}.rejected,.revoked{background:#3b171d;color:#ff929e}.hint{color:#66748c;font-size:12px;margin-top:12px}.auth{display:grid;place-items:center;min-height:560px}.auth .card{width:min(450px,100%);padding:32px}.icon{width:48px;height:48px;display:grid;place-items:center;border-radius:12px;background:linear-gradient(135deg,#347fff,#704dff);font-weight:800;margin-bottom:20px}.table{overflow:hidden}.scroll{overflow-x:auto}table{width:100%;border-collapse:collapse;min-width:1050px}th,td{text-align:left;padding:14px;border-bottom:1px solid #1c2739;font-size:12px;white-space:nowrap}th{font-size:10px;text-transform:uppercase;letter-spacing:.7px;color:#758198;background:#0a101b}td{color:#d5dce8}.mono{font-family:monospace;color:#aebfff}.actions{display:flex;gap:7px}.small{padding:6px 9px;border:1px solid #29364e;border-radius:7px;background:#111927;color:#fff;font-size:11px;cursor:pointer}.small.ok{color:#72e4a7;border-color:#23593f}.small.no{color:#ff9aa5;border-color:#5d2b34}.muted{color:#69768c;font-size:11px}@media(max-width:720px){.top{padding:0 18px}.nav{gap:9px}.nav a:nth-child(2),.nav a:nth-child(3),.nav a:nth-child(4){display:none}.page{padding:30px 16px}.hero h1{font-size:54px}.grid{grid-template-columns:1fr}.inline{flex-direction:column;align-items:stretch}.result{grid-template-columns:1fr 1fr}}
</style></head>
<body><div id="app"></div>
<script>
const API = '/api';
const STATES=['Andhra Pradesh','Arunachal Pradesh','Assam','Bihar','Chhattisgarh','Goa','Gujarat','Haryana','Himachal Pradesh','Jharkhand','Karnataka','Kerala','Madhya Pradesh','Maharashtra','Manipur','Meghalaya','Mizoram','Nagaland','Odisha','Punjab','Rajasthan','Sikkim','Tamil Nadu','Telangana','Tripura','Uttar Pradesh','Uttarakhand','West Bengal'];
let token = localStorage.getItem('cv-token') || '';
let logged = !!token;
const go=p=>{location.hash=p};
const authHeaders=()=>token?{'Authorization':'Bearer '+token}:{};
async function api(path, options={}){
  const headers={'Content-Type':'application/json',...(options.headers||{}),...authHeaders()};
  const res=await fetch(API+path,{...options,headers});
  let data={}; try{data=await res.json()}catch{}
  if(!res.ok) throw new Error(data.message||'Request failed');
  return data;
}
function nav(){let p=location.hash.slice(1)||'/';let admin=p.startsWith('/admin');return `<header class="top"><a class="brand" href="#/">Cred<span>Vault</span></a><nav class="nav">${admin&&logged?`<a href="#/admin/applications">Applications</a><a href="#/admin/certificates">Certificates</a><button onclick="logout()">Exit</button>`:`<a href="#/" class="${p==='/'?'active':''}">Home</a><a href="#/request" class="${p==='/request'?'active':''}">Request</a><a href="#/track" class="${p==='/track'?'active':''}">Track</a><a href="#/verify" class="${p==='/verify'?'active':''}">Verify</a><a href="#/admin/login">Admin</a>`}</nav></header>`}
function shell(body){return `<div class="app">${nav()}<main class="page">${body}</main><footer>CredVault • Certificate Issuing & Verification Platform</footer></div>`}
function header(t,s){return `<div class="header"><div class="eyebrow">CREDVAULT</div><h2>${t}</h2><p>${s}</p></div>`}
function field(label,name,type='text',value='',ph=''){return `<div class="field"><label>${label}</label><input name="${name}" type="${type}" value="${value}" placeholder="${ph}"></div>`}
function status(s){return `<span class="status ${String(s).toLowerCase()}">${s}</span>`}
function home(){return shell(`<section class="hero"><div class="glow g1"></div><div class="glow g2"></div><div class="content"><div class="eyebrow">DIGITAL CREDENTIALS • SECURE • SIMPLE</div><h1>Cred<span>Vault</span></h1><p>Certificate Issuing & Verification Platform</p><div class="buttons"><a class="btn primary" href="#/request">Request Certificate</a><a class="btn" href="#/track">Track Application</a><a class="btn" href="#/verify">Verify Certificate</a></div></div></section>`)}
function request(){return shell(`${header('Request Certificate','Submit your details to request a digital certificate.')}<div class="card form-card" id="requestCard"><form id="requestForm"><div class="grid">${field('Name','name','text','','Enter your full name')}${field('Phone','phone','tel','','10-digit mobile number')}<div class="field"><label>Gender</label><div class="radio"><label><input type="radio" name="gender" value="Male"> Male</label><label><input type="radio" name="gender" value="Female"> Female</label><label><input type="radio" name="gender" value="Other"> Other</label></div></div>${field('City','city','text','','Enter city')}<div class="field"><label>State</label><select name="state"><option value="">Select state</option>${STATES.map(s=>`<option>${s}</option>`).join('')}</select></div></div><div id="err"></div><button class="btn primary wide">Submit Request</button></form></div>`)}
function track(){return shell(`${header('Track Application','Check the current status of your certificate request.')}<div class="card compact"><form class="inline" id="trackForm"><div class="field"><label>Application ID</label><input id="trackId" placeholder="APP-0001"></div><button class="btn primary">Track</button></form><div id="trackResult"></div></div>`)}
function verify(){return shell(`${header('Verify Certificate','Verify the authenticity and current status of a certificate.')}<div class="card compact"><form class="inline" id="verifyForm"><div class="field"><label>Certificate ID</label><input id="certId" placeholder="CERT-1001"></div><button class="btn primary">Verify</button></form><div id="verifyResult"></div></div>`)}
function login(){if(logged)return redirect('/admin/applications');return shell(`<div class="auth"><div class="card"><div class="icon">CV</div>${header('Admin Login','Sign in to manage applications and certificates.')}<form id="loginForm">${field('Username','user','','','admin')}${field('Password','pass','password','','admin')}<div id="loginErr"></div><button class="btn primary wide">Login</button></form><div class="hint">Demo credentials: <b>admin</b> / <b>admin</b></div></div></div>`)}
function redirect(p){location.hash=p}
function adminApps(){if(!logged)return redirect('/admin/login');return shell(`${header('Applications','Review, approve, or reject certificate requests.')}<div class="card table"><div class="scroll"><table><thead><tr><th>Application ID</th><th>Name</th><th>Phone</th><th>Gender</th><th>City</th><th>State</th><th>Status</th><th>Action</th></tr></thead><tbody><tr><td colspan="8" class="muted">Loading applications...</td></tr></tbody></table></div></div>`)}
function adminCerts(){if(!logged)return redirect('/admin/login');return shell(`${header('Certificates','Manage issued certificates and revoke credentials when required.')}<div class="card table"><div class="scroll"><table><thead><tr><th>Certificate ID</th><th>Name</th><th>Phone</th><th>City</th><th>State</th><th>Issued On</th><th>Status</th><th>Action</th></tr></thead><tbody><tr><td colspan="8" class="muted">Loading certificates...</td></tr></tbody></table></div></div>`)}
function fmtDate(v){if(!v)return '-';const d=new Date(v);return isNaN(d)?v:d.toLocaleDateString('en-GB',{day:'2-digit',month:'short',year:'numeric'})}
function cleanId(v){return v.trim().replace(/^#/,'')}
async function loadAdminApps(){try{const rows=await api('/admin/applications');const tbody=document.querySelector('table tbody');tbody.innerHTML=rows.length?rows.map(a=>`<tr><td class="mono">#${a.applicationId}</td><td>${a.name}</td><td>${a.phone}</td><td>${a.gender}</td><td>${a.city}</td><td>${a.state}</td><td>${status(a.status)}</td><td><div class="actions">${a.status==='Pending'?`<button class="small ok" onclick="approve('${a.applicationId}')">Issue</button><button class="small no" onclick="rejectApp('${a.applicationId}')">Reject</button>`:a.status==='Rejected'?'<span class="muted">Rejected</span>':'<span class="muted">Approved</span>'}</div></td></tr>`).join(''):`<tr><td colspan="8" class="muted">No applications yet.</td></tr>`}catch(e){if(e.message.includes('authentication')){logout()}else alert(e.message)}}
async function loadAdminCerts(){try{const rows=await api('/admin/certificates');const tbody=document.querySelector('table tbody');tbody.innerHTML=rows.length?rows.map(c=>`<tr><td class="mono">#${c.certificateId}</td><td>${c.name}</td><td>${c.phone}</td><td>${c.city}</td><td>${c.state}</td><td>${fmtDate(c.issuedOn)}</td><td>${status(c.status)}</td><td>${c.status==='Valid'?`<button class="small no" onclick="revokeCert('${c.certificateId}')">Revoke</button>`:'<span class="muted">Revoked</span>'}</td></tr>`).join(''):`<tr><td colspan="8" class="muted">No certificates yet.</td></tr>`}catch(e){if(e.message.includes('authentication'))logout();else alert(e.message)}}
function render(){let p=location.hash.slice(1)||'/';let html=p==='/'?home():p==='/request'?request():p==='/track'?track():p==='/verify'?verify():p==='/admin/login'?login():p==='/admin/applications'?adminApps():p==='/admin/certificates'?adminCerts():home();document.getElementById('app').innerHTML=html;bind();if(p==='/admin/applications'&&logged)loadAdminApps();if(p==='/admin/certificates'&&logged)loadAdminCerts()}
function bind(){
 const f=document.getElementById('requestForm');
 if(f)f.onsubmit=async e=>{e.preventDefault();let d=new FormData(f),data=Object.fromEntries(d.entries()),err=document.getElementById('err');if(!data.name||!data.phone||!data.gender||!data.city||!data.state){err.innerHTML='<div class="error">Please complete all fields.</div>';return}if(!/^\d{10}$/.test(data.phone)){err.innerHTML='<div class="error">Please enter a valid 10-digit phone number.</div>';return}const btn=f.querySelector('button');btn.disabled=true;btn.textContent='Submitting...';try{const r=await api('/applications',{method:'POST',body:JSON.stringify(data)});document.getElementById('requestCard').innerHTML=`<div class="success"><div class="check">✓</div><h3>Application submitted successfully!</h3><p>Application ID: <b>#${r.applicationId}</b></p><p class="hint">Status: ${status(r.status)}</p><button class="btn" onclick="go('/track')">Track Application</button></div>`}catch(e){err.innerHTML=`<div class="error">${e.message}</div>`;btn.disabled=false;btn.textContent='Submit Request'}};
 const t=document.getElementById('trackForm');if(t)t.onsubmit=async e=>{e.preventDefault();const id=cleanId(document.getElementById('trackId').value);const r=document.getElementById('trackResult');if(!id){r.innerHTML='<div class="error">Enter an Application ID.</div>';return}r.innerHTML='<div class="hint">Loading...</div>';try{const a=await api('/applications/track/'+encodeURIComponent(id));r.innerHTML=`<div class="result"><div><span>Applicant</span><strong>${a.name}</strong></div><div><span>Status</span>${status(a.status)}</div><div><span>Submission Date</span><strong>${fmtDate(a.submittedAt)}</strong></div></div>`}catch(e){r.innerHTML=`<div class="error">${e.message}</div>`}};
 const v=document.getElementById('verifyForm');if(v)v.onsubmit=async e=>{e.preventDefault();const id=cleanId(document.getElementById('certId').value);const r=document.getElementById('verifyResult');if(!id){r.innerHTML='<div class="error">Enter a Certificate ID.</div>';return}r.innerHTML='<div class="hint">Loading...</div>';try{const c=await api('/certificates/verify/'+encodeURIComponent(id));r.innerHTML=`<div class="result"><div><span>Name</span><strong>${c.name}</strong></div><div><span>Phone</span><strong>${c.phone}</strong></div><div><span>Issued On</span><strong>${fmtDate(c.issuedOn)}</strong></div><div><span>Status</span>${status(c.status)}</div></div>`}catch(e){r.innerHTML=`<div class="error">${e.message}</div>`}};
 const l=document.getElementById('loginForm');if(l)l.onsubmit=async e=>{e.preventDefault();const d=new FormData(l),err=document.getElementById('loginErr'),btn=l.querySelector('button');btn.disabled=true;btn.textContent='Signing in...';try{const r=await api('/admin/login',{method:'POST',body:JSON.stringify({username:d.get('user'),password:d.get('pass')})});token=r.token;logged=true;localStorage.setItem('cv-token',token);go('/admin/applications')}catch(e){err.innerHTML=`<div class="error">${e.message}</div>`;btn.disabled=false;btn.textContent='Login'}};
}
async function approve(id){try{const r=await api('/admin/applications/'+id+'/approve',{method:'PATCH'});alert(`Approved. Certificate ID: ${r.certificateId}`);render()}catch(e){alert(e.message)}}
async function rejectApp(id){try{await api('/admin/applications/'+id+'/reject',{method:'PATCH'});alert('Application rejected');render()}catch(e){alert(e.message)}}
async function revokeCert(id){if(!confirm('Revoke this certificate?'))return;try{await api('/admin/certificates/'+id+'/revoke');alert('Certificate revoked');render()}catch(e){alert(e.message)}}
function logout(){token='';logged=false;localStorage.removeItem('cv-token');go('/admin/login')}
window.addEventListener('hashchange',render);render();

</script></body></html>
